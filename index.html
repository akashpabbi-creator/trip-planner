<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Our Trip Planner</title>
  <meta name="theme-color" content="#2747d4" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" title="All trips"><i class="logo-tile"><svg class="i" aria-hidden="true"><use href="icons.svg#flight"/></svg></i><span>Trip Planner</span></button>
    <div class="presence" id="presence"></div>
    <div class="sync" id="sync" hidden></div>
    <div class="user" id="userBox"></div>
  </header>

  <main id="app"><div class="loading">Loading…</div></main>

  <dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="mcp-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
