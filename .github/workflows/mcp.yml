name: Trips connector
on:
  push:
    branches: [main]
    paths: ["mcp/**", "connect.html", "mcp-config.js", "firestore.rules", "tests/mcp-*.mjs", ".github/workflows/mcp.yml"]
  pull_request:
    paths: ["mcp/**", "connect.html", "mcp-config.js", "firestore.rules", "tests/mcp-*.mjs", ".github/workflows/mcp.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: mcp
      - run: npm i --prefix /tmp/fbt firebase-tools@15
      # Runs the real Worker against the Firestore and Auth emulators: OAuth sign-in, aiUsers gate, read tools.
      - run: node tests/mcp-core.mjs
        env:
          FIREBASE_BIN: /tmp/fbt/node_modules/.bin/firebase

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Deploys only when the Cloudflare secrets exist; otherwise it says so and passes.
      - id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare secrets are not set, so the connector was not deployed (see HANDOFF-connector.md)."; fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.gate.outputs.go == 'true'
        # Secrets pasted from Windows can carry a BOM (U+FEFF), spaces or a newline, which wrangler rejects in the auth header.
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | sed 's/\xEF\xBB\xBF//g' | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | sed 's/\xEF\xBB\xBF//g' | tr -d '[:space:]')"
          npm ci && npx wrangler deploy
        working-directory: mcp
