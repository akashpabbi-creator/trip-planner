name: Real data check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/real-data.mjs


  app-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      # Demo mode: data stays in the test browser, nothing touches Firebase.
      - run: echo 'window.FIREBASE_CONFIG = null;' > config.js
      - run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2 && node tests/e2e-real.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: e2e-*.png
